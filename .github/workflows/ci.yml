name: Check plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Check committed bundle is current
        run: git diff --exit-code -- main.js
